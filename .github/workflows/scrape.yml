name: Daily job scraping

on:
  push:
    branches: [main]
    paths:
      - "scrappy/codes/geoloc.py"
      - "scrappy/codes/locations.json"
      - "location_identity.py"
      - "country_reference.json"
  schedule:
    # Runs every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test location and API filters
        run: python -m unittest -v test_company_filter test_country_filter test_global_geography

      - name: Remove previous output
        run: rm -rf output

      - name: Run scraper
        run: python scrap.py

      - name: Commit updated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "John Update"
            git push
          fi