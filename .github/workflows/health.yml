name: Monthly tenant health checks

on:
  schedule:
    # Runs on the first day of every month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper-jobs
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check tenant health
        run: |
          python health/ashby_health.py
          python health/bamboo_health.py
          python health/green_health.py
          python health/lever_health.py
          python health/personio_health.py
          python health/recruit_health.py
          python health/worka_health.py
          python health/workd_health.py

      - name: Commit cleaned tenant files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No tenant changes to commit."
          else
            git commit -m "Update tenant health data"
            git push
          fi